name: Update TrueRate data

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"
  schedule:
    # 09:15 JST. Broker calendars reflect NY-close swaps before this run.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: truerate-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Refresh broker swap and FX reference data
        run: python scripts/update_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "truerate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/swaps data/rates site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh daily rates and swaps"
            git pull --rebase origin main
            git push
          fi
