name: Verify GMO Click NZDUSD repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-gmo-nzdusd.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repaired raw and normalized data
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          rows=[]
          with open("data/swaps/gmo_click.csv",encoding="utf-8",newline="") as f:
              for r in csv.DictReader(f):
                  if r["pair"]=="NZD/USD" and r["status"]=="confirmed":
                      rows.append(r)
          assert rows, "no confirmed GMO Click NZD/USD rows"
          nonzero=[r for r in rows if abs(float(r["long_swap_jpy"] or 0))>0 or abs(float(r["short_swap_jpy"] or 0))>0]
          assert nonzero, "GMO Click NZD/USD still has no nonzero swaps"
          print("RAW_COUNT",len(rows),"NONZERO",len(nonzero))
          print("RAW_RECENT",rows[-12:])

          data=json.loads(Path("site/data/site-data.json").read_text(encoding="utf-8"))
          item=data["series"]["NZD/USD"]["gmo_click"]
          pts=item["points"]
          deltas=[]
          for a,b in zip(pts[-20:-1],pts[-19:]):
              dl=b["cum_long_swap_jpy"]-a["cum_long_swap_jpy"]
              ds=b["cum_short_swap_jpy"]-a["cum_short_swap_jpy"]
              if abs(dl)>1e-9 or abs(ds)>1e-9:
                  deltas.append((b["date"],round(dl,6),round(ds,6)))
          assert deltas, "site-data GMO Click NZD/USD has no recent swap deltas"
          print("SITE_DELTAS",deltas[-10:])
          PY
      - name: Check frontend JavaScript
        run: node --check site/app.js
