name: Inspect DMM swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dmm-central.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect DMM scripts and inline code
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          u="https://fx.dmm.com/fx/service/swapcalendar/"
          r=requests.get(u,headers=h,timeout=30)
          r.raise_for_status()
          r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          print("PAGE",r.status_code,r.url,len(r.text))

          print("ALL_SCRIPTS")
          for sc in soup.find_all("script"):
              src=sc.get("src")
              if src:
                  su=urljoin(r.url,src)
                  print("SCRIPT",su)
                  try:
                      x=requests.get(su,headers=h,timeout=30)
                      txt=x.text
                      if any(k in txt.lower() for k in ("swap","calendar")):
                          print("RELEVANT_SCRIPT",su,len(txt))
                          for line in txt.splitlines():
                              if any(k in line.lower() for k in ("swap","calendar","ajax","json","fetch")):
                                  print("JSLINE",line[:2200])
                  except Exception as e:
                      print("ERR",e)
              else:
                  txt=sc.get_text("\n")
                  if any(k in txt.lower() for k in ("swap","calendar","ajax","json","fetch")):
                      print("INLINE_SCRIPT",txt[:12000].replace("\n"," | "))

          print("LINKS")
          for tag in soup.find_all(["link","a"],href=True):
              href=urljoin(r.url,tag["href"])
              txt=tag.get_text(" ",strip=True)
              if any(k in (href+" "+txt).lower() for k in ("swap","calendar","json","csv")):
                  print("LINK",txt[:100],href)

          print("URL_LIKE")
          for m in re.finditer(r'[^"\'\s<>]{0,120}(?:swap|calendar)[^"\'\s<>]{0,180}',r.text,re.I):
              print("URLLIKE",m.group(0)[:500])
          PY
