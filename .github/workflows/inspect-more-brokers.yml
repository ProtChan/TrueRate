name: Inspect additional broker sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-more-brokers.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect broker pages
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          pages={
            "lightfx":"https://lightfx.jp/market/swap/",
            "sbi":"https://www.sbifxt.co.jp/FXTAccount/pc/SWHis",
            "hirose":"https://hirose-fx.co.jp/contents/news/Swap",
            "jfx":"https://info.jfx.co.jp/jfxapl/mnavi/mnavi_SwapPoint.jsp",
          }
          # Focused probes before the broad dump.
          print("\n==== focused probes ====")
          # Hirose historical CSV
          hu="https://hirose-fx.co.jp/swap/lionfx_swap.csv"
          hr=requests.get(hu,headers=h,timeout=30)
          print("HIROSE_CSV",hr.status_code,len(hr.content),hr.headers.get("content-type"))
          for enc in ("cp932","utf-8-sig","shift_jis"):
              try:
                  txt=hr.content.decode(enc)
                  print("HIROSE_ENCODING",enc)
                  print(txt[:7000])
                  print("HIROSE_TAIL",txt[-3500:])
                  break
              except Exception:
                  pass

          # SBI historical month POST probes.
          su=pages["sbi"]
          session=requests.Session()
          session.headers.update(h)
          landing=session.get(su,timeout=30)
          ss=BeautifulSoup(landing.text,"html.parser")
          guid=(ss.find("input",{"name":"GUID"}) or {}).get("value") if ss.find("input",{"name":"GUID"}) else None
          for y,m in ((2026,"08"),(2025,"12"),(2024,"01")):
              payload={"YEAR":str(y),"MONTH":m,"pcTerminal":"検索","SELECTED_TERMINAL":"pcTerminal","SELECTED_CURRENCY_UNIT":"tenThousandCurrencyUnit"}
              if guid: payload["GUID"]=guid
              q=session.post("https://www.sbifxt.co.jp/FXTAccount/pc/SWHis?RICH=Y",data=payload,timeout=30)
              qs=BeautifulSoup(q.text,"html.parser")
              rows=[]
              table=qs.find("table")
              if table:
                  for tr in table.find_all("tr")[:8]:
                      cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                      if cells: rows.append(cells)
              selected=[o.get("value") for o in qs.select("#YEAR option[selected], #MONTH option[selected]")]
              print("SBI_PROBE",y,m,q.status_code,q.url,len(q.text),"selected",selected,"rows",rows[:5])

          # JFX direct iframe/date probes.
          ju=pages["jfx"]
          js=requests.Session()
          js.headers.update(h)
          for st in ("20260924","P20260924","20250924"):
              parent=js.get(ju,params={"stdate":st},timeout=30)
              ps=BeautifulSoup(parent.text,"html.parser")
              iframe=ps.find("iframe")
              print("JFX_PARENT",st,parent.status_code,parent.url,len(parent.text),"iframe",iframe.get("src") if iframe else None)
              if iframe:
                  iu=urljoin(parent.url,iframe.get("src"))
                  ir=js.get(iu,headers={**h,"Referer":parent.url},timeout=30)
                  ins=BeautifulSoup(ir.text,"html.parser")
                  print("JFX_IFRAME",st,ir.status_code,ir.url,len(ir.text),ir.headers.get("content-type"))
                  for i,table in enumerate(ins.find_all("table")[:8]):
                      rows=[]
                      for tr in table.find_all("tr")[:8]:
                          cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                          if cells: rows.append(cells)
                      if rows: print(" JFX_TABLE",i,rows[:6])

          for name,u in pages.items():
              print("\n====",name,u,"====")
              r=requests.get(u,headers=h,timeout=30)
              print("PAGE",r.status_code,r.url,len(r.text),r.headers.get("content-type"))
              soup=BeautifulSoup(r.text,"html.parser")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              print("FORMS")
              for form in soup.find_all("form"):
                  print("FORM",form.get("action"),form.get("method"),form.get("id"),form.get("name"))
                  for tag in form.find_all(["select","input","button"])[:80]:
                      print(" ",tag.name,tag.get("name"),tag.get("value"),tag.get("type"),tag.get("id"))
              print("LINKS")
              for a in soup.find_all("a",href=True):
                  txt=a.get_text(" ",strip=True)
                  href=urljoin(r.url,a["href"])
                  if any(k in (txt+" "+href).lower() for k in ("csv","swap","スワップ","過去","history")):
                      print(txt[:120],href)
              print("INLINE MATCHES")
              for pat in [
                  r'.{0,220}(?:csv|json|api|ajax|fetch|year|month|ym|date|swap).{0,650}',
                  r'https?://[^"\'<> ]+',
              ]:
                  for m in re.finditer(pat,r.text,re.I|re.S):
                      z=m.group(0).replace("\n"," ")
                      if any(k in z.lower() for k in ("csv","api","ajax","fetch","swap","year","month")):
                          print(z[:1100])
              print("TABLE HEADERS")
              for i,table in enumerate(soup.find_all("table")[:12]):
                  headers=[x.get_text(" ",strip=True) for x in table.find_all("th")]
                  rows=[]
                  for tr in table.find_all("tr")[:8]:
                      cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                      if cells: rows.append(cells)
                  print("TABLE",i,headers[:30])
                  for row in rows[:6]: print(" ROW",row[:30])
          PY
