name: Inspect Invast swap calendar internals

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-invast.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: pip install requests

      - name: Inspect page source and JS assets
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin

          url="https://www.invast.jp/triauto/swap-calendar/"
          h={"User-Agent":"Mozilla/5.0"}
          r=requests.get(url,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)',r.text,re.I)
          print("SCRIPTS",scripts)
          print("\nPAGE MATCHES")
          pats=[r'https?://[^"\'<> ]+', r'/swappoint/[^"\'<> ]+', r'.{0,220}cllAPI.{0,420}', r'.{0,220}(?:swapData|swap_data|adddays|pairCode|pair_id).{0,420}']
          for pat in pats:
              for m in re.finditer(pat,r.text,re.I|re.S):
                  s=m.group(0).replace("\n"," ")
                  if "swap" in s.lower() or "cllapi" in s.lower() or "adddays" in s.lower():
                      print(s[:700])
          print("\nSAMPLE CSV")
          samples=[
              "https://www.invast.jp/triauto/service/summary/swap_csv/dailyswap.php?year=2026&month=9",
              "https://www.invast.jp/swappoint/adddays/adddays.php?year=2026&month=9",
              "https://www.invast.jp/triauto/service/summary/swap_csv/2026/DAILY_SWAP_POINT_LIST_20260924.csv",
              "https://www.invast.jp/triauto/service/summary/swap_csv/2026/DAILY_SWAP_POINT_LIST_20260923.csv",
              "https://www.invast.jp/swappoint/adddays/valuedate_202609.csv",
          ]
          for u in samples:
              z=requests.get(u,headers=h,timeout=30)
              print("\nCSV",z.status_code,u,len(z.content))
              print(z.content[:4000].decode("utf-8-sig",errors="replace"))
          for src in scripts:
              u=urljoin(r.url,src)
              try:
                  x=requests.get(u,headers=h,timeout=30)
                  print("\nASSET",x.status_code,u,len(x.text))
                  for m in re.finditer(r'.{0,160}(?:swap|api|calendar|axios|fetch).{0,240}',x.text,re.I|re.S):
                      s=m.group(0).replace("\n"," ")
                      if "swap" in s.lower() or "api" in s.lower():
                          print(s[:450])
              except Exception as e:
                  print("ERR",u,e)
          PY
