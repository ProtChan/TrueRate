name: Audit GMO Click swaps

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-gmo-click.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Audit stored history and live official month
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          import csv, re, requests
          from collections import defaultdict
          from datetime import date
          from bs4 import BeautifulSoup
          from truerate.brokers.gmo_click import STANDARD_PAIRS, collect_pair_month, BASE_URL

          stored=defaultdict(list)
          with open("data/swaps/gmo_click.csv",encoding="utf-8",newline="") as f:
              for r in csv.DictReader(f):
                  stored[r["pair"]].append(r)

          suspicious=[]
          print("STORED_SUMMARY")
          for pair in STANDARD_PAIRS:
              rows=stored.get(pair,[])
              positive=[]
              zero_pos=[]
              blank_pos=[]
              for r in rows:
                  try: sp=int(float(r.get("sp_days") or 0))
                  except: sp=0
                  if sp>0:
                      positive.append(r)
                      lv=r.get("long_swap_jpy")
                      sv=r.get("short_swap_jpy")
                      if lv in ("",None) or sv in ("",None):
                          blank_pos.append(r)
                      else:
                          try:
                              if float(lv)==0 or float(sv)==0:
                                  zero_pos.append(r)
                          except: pass
              print(pair,"rows",len(rows),"positive_days",len(positive),"blank_positive",len(blank_pos),"zero_side_positive",len(zero_pos))
              if blank_pos or zero_pos:
                  suspicious.extend((pair,x) for x in (blank_pos+zero_pos)[:8])

          print("SUSPICIOUS_STORED",suspicious[:80])

          today=date(2026,9,26)
          print("LIVE_COMPARE")
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"})
          live_anomalies=[]
          external_cells=[]
          for pair in STANDARD_PAIRS:
              records=collect_pair_month(2026,9,pair,session=session,today_jst=today)
              nonzero=[r for r in records if (r.sp_days or 0)>0]
              bad=[r for r in nonzero if r.long_swap_jpy in (None,0) or r.short_swap_jpy in (None,0)]
              print("LIVE",pair,"rows",len(records),"positive",len(nonzero),"bad",[(r.trade_date,r.long_swap_jpy,r.short_swap_jpy,r.sp_days) for r in bad[:10]])
              if bad: live_anomalies.append((pair,bad[:10]))

              resp=session.get(BASE_URL,params={"year":"2026","month":"09","pare":pair.replace("/","")},timeout=30)
              resp.raise_for_status()
              resp.encoding=resp.apparent_encoding or resp.encoding
              soup=BeautifulSoup(resp.text,"html.parser")
              for table in soup.find_all("table"):
                  txt=table.get_text(" ",strip=True)
                  if not all(x in txt for x in ("取引日","売Swap","買Swap","付与日数")):
                      continue
                  for tr in table.find_all("tr"):
                      vals=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                      if len(vals)>=4 and any(sym in (vals[1]+" "+vals[2]) for sym in ("$","€","£","CHF","AUD","NZD")):
                          external_cells.append((pair,vals[:4]))
          print("LIVE_ANOMALIES",live_anomalies)
          print("EXTERNAL_CELLS_PAIRS",sorted(set(x[0] for x in external_cells)))
          print("EXTERNAL_SAMPLES",external_cells[:40])
          PY
