name: Update TrueRate data

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/update-data.yml"
  schedule:
    # 09:15 JST. Broker calendars reflect NY-close swaps before this run.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: truerate-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Refresh broker swap and FX reference data
        run: python scripts/update_data.py

      - name: Commit refreshed data
        run: |
          git config user.name "truerate-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/swaps data/rates site/data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "data: refresh daily rates and swaps"
            git pull --rebase origin main
            git push
          fi


  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout refreshed main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
