name: Inspect OANDA NY source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-oanda-ny.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect NY calendar internals
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          u="https://www.oanda.jp/fx/ny4/swap"
          r=requests.get(u,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          hist=soup.find("swap-history")
          print("SWAP_HISTORY_ATTRS",dict(hist.attrs) if hist else None)
          if hist:
              instruments=hist.get("instruments") or "[]"
              print("INSTRUMENTS",instruments)
              print("SPAN",hist.get("span-start"),hist.get("span-end"),hist.get("type"))
          for ym in ("201904","202609"):
              for pair in ("usdjpy","zarjpy","audcad"):
                  url=f"https://www.oanda.jp/service/swappoint/swap_ny4_{pair}_{ym}.json"
                  rr=requests.get(url,headers=h,timeout=30)
                  print("JSON",ym,pair,rr.status_code,len(rr.content),rr.headers.get("content-type"))
                  if rr.ok:
                      try:
                          obj=rr.json()
                          print("JSON_TYPE",type(obj).__name__)
                          print("JSON_HEAD",str(obj)[:1800])
                      except Exception as e:
                          print("JSON_ERR",e,rr.text[:1000])
          for form in soup.find_all("form"):
              print("FORM",form.get("action"),form.get("method"),form.get("id"),form.get("name"))
              for tag in form.find_all(["select","input","option","button"])[:300]:
                  print(tag.name,tag.get("name"),tag.get("value"),tag.get("id"),bool(tag.get("selected")),tag.get_text(" ",strip=True)[:120])
          for s in soup.find_all("script",src=True):
              su=urljoin(r.url,s["src"])
              print("SCRIPT",su)
              try:
                  x=requests.get(su,headers=h,timeout=30)
                  if any(k in x.text.lower() for k in ("swap","calendar","ajax","json","api","fetch")):
                      for m in re.finditer(r'.{0,220}(?:swap|calendar|ajax|json|api|fetch).{0,900}',x.text,re.I|re.S):
                          print("MATCH",m.group(0).replace("\n"," ")[:1400])
              except Exception as e: print("ERR",e)
          lineup=requests.get("https://www.oanda.jp/fx/ny4/retail-lineup",headers=h,timeout=30)
          print("LINEUP_PAGE",lineup.status_code,len(lineup.text))
          ls=BeautifulSoup(lineup.text,"html.parser")
          for table in ls.find_all("table"):
              rows=[]
              for tr in table.find_all("tr"):
                  cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                  if cells: rows.append(cells)
              if any(row and "/" in row[0] for row in rows):
                  print("LINEUP_TABLE")
                  for row in rows[:100]: print("LINEUP_ROW",row[:12])
                  break
          for m in re.finditer(r'.{0,220}(?:swap|calendar|ajax|json|api|fetch).{0,800}',r.text,re.I|re.S):
              z=m.group(0).replace("\n"," ")
              print("INLINE",z[:1400])
          PY
