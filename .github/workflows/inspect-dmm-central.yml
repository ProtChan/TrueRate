name: Inspect DMM and Central FX sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dmm-central.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official pages and endpoints
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          pages={
              "dmm":"https://fx.dmm.com/fx/service/swapcalendar/",
              "central":"https://www.central-tanshifx.com/fxdirectplus/fxlive/swap/",
          }

          for name,u in pages.items():
              print("\n====",name,u,"====")
              r=requests.get(u,headers=h,timeout=30)
              print("PAGE",r.status_code,r.url,len(r.text),r.headers.get("content-type"))
              soup=BeautifulSoup(r.text,"html.parser")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              print("FORMS")
              for form in soup.find_all("form"):
                  print("FORM",form.get("action"),form.get("method"),form.get("id"),form.get("name"))
                  for tag in form.find_all(["select","input","button"])[:120]:
                      print(" ",tag.name,tag.get("name"),tag.get("value"),tag.get("type"),tag.get("id"))
              print("SCRIPTS")
              for sc in soup.find_all("script",src=True):
                  su=urljoin(r.url,sc["src"])
                  print("SCRIPT",su)
                  try:
                      x=requests.get(su,headers=h,timeout=30)
                      if any(k in x.text.lower() for k in ("swap","api","ajax","json","fetch","calendar")):
                          print(" LEN",len(x.text))
                          for pat in [
                              r'https?://[^"\'<> ]+',
                              r'["\']([^"\']*(?:swap|api|json|calendar)[^"\']*)["\']',
                              r'.{0,180}(?:swap|api|ajax|json|fetch|calendar).{0,600}',
                          ]:
                              for m in re.finditer(pat,x.text,re.I|re.S):
                                  z=m.group(0).replace("\n"," ")
                                  if any(k in z.lower() for k in ("swap","api","json","fetch","calendar")):
                                      print(" MATCH",z[:1200])
                  except Exception as e:
                      print(" SCRIPT_ERR",e)
              print("TABLES")
              for i,table in enumerate(soup.find_all("table")[:20]):
                  rows=[]
                  for tr in table.find_all("tr")[:12]:
                      cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                      if cells: rows.append(cells)
                  if rows:
                      print("TABLE",i)
                      for row in rows[:10]: print(" ROW",row[:40])
              print("INLINE")
              for m in re.finditer(r'.{0,180}(?:swap|api|ajax|json|fetch|calendar|simulat).{0,650}',r.text,re.I|re.S):
                  z=m.group(0).replace("\n"," ")
                  print(" ",z[:1200])

          # Central likely paths / public simulator probes
          probes=[
              "https://www.central-tanshifx.com/fxdirectplus/fxlive/swap/",
              "https://www.central-tanshifx.com/fxdirectplus/fxlive/swap/simulator/",
              "https://www.central-tanshifx.com/market/swap/",
              "https://www.central-tanshifx.com/api/swap/",
          ]
          for u in probes:
              try:
                  r=requests.get(u,headers=h,timeout=30,allow_redirects=True)
                  print("CENTRAL_PROBE",u,r.status_code,r.url,len(r.text),r.headers.get("content-type"))
              except Exception as e:
                  print("CENTRAL_PROBE_ERR",u,e)
          PY
