name: Verify arbitrage UI final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-arbitrage-final.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Sanity-check 1Y cross-broker opportunities
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path

          data=json.loads(Path("site/data/site-data.json").read_text(encoding="utf-8"))
          rows=[]
          for pair, brokers in data["series"].items():
              candidates=[]
              for broker,item in brokers.items():
                  pts=item.get("points") or []
                  if len(pts)<2:
                      continue
                  end=pts[-1]["date"]
                  y,m,d=map(int,end.split("-"))
                  cutoff=f"{y-1:04d}-{m:02d}-{d:02d}"
                  pp=[p for p in pts if p["date"]>=cutoff]
                  if len(pp)>=2:
                      candidates.append((broker,pp))
              if len(candidates)<2:
                  continue
              start=min(pp[0]["date"] for _,pp in candidates)
              end=max(pp[-1]["date"] for _,pp in candidates)
              eligible=[x for x in candidates if x[1][0]["date"]==start and x[1][-1]["date"]==end]
              if len(eligible)<2:
                  continue
              best=None
              for b1,p1 in eligible:
                  for b2,p2 in eligible:
                      if b1==b2: continue
                      buy=p1[-1]["cum_long_swap_jpy"]-p1[0]["cum_long_swap_jpy"]
                      sell=p2[-1]["cum_short_swap_jpy"]-p2[0]["cum_short_swap_jpy"]
                      net=buy+sell
                      if best is None or net>best[0]:
                          best=(net,b1,b2,start,end)
              if best:
                  rows.append((best[0],pair,*best[1:]))
          rows.sort(reverse=True)
          assert rows, "No arbitrage rows produced"
          print("ARBITRAGE_TOP", rows[:10])
          PY
