name: Inspect DMM swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dmm-central.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect DMM calendar
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          u="https://fx.dmm.com/fx/service/swapcalendar/"
          r=requests.get(u,headers=h,timeout=30)
          r.raise_for_status()
          r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          print("PAGE",r.status_code,r.url,len(r.text))
          print("SELECTS")
          for sel in soup.find_all("select"):
              vals=[(o.get("value"),o.get_text(" ",strip=True),bool(o.get("selected"))) for o in sel.find_all("option")]
              print(sel.get("id"),sel.get("name"),vals[:80])
          print("TABLES")
          for i,table in enumerate(soup.find_all("table")):
              heads=[x.get_text(" ",strip=True) for x in table.find_all("th")]
              rows=[]
              for tr in table.find_all("tr")[:14]:
                  cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                  if cells: rows.append(cells)
              if rows:
                  print("TABLE",i,"HEADS",heads[:40])
                  for row in rows[:12]: print("ROW",row[:40])
          print("DMM_RELEVANT_SCRIPTS")
          for sc in soup.find_all("script",src=True):
              su=urljoin(r.url,sc["src"])
              if any(k in su.lower() for k in ("swap","calendar","service")):
                  print("SCRIPT",su)
                  x=requests.get(su,headers=h,timeout=30)
                  print("LEN",len(x.text))
                  for m in re.finditer(r'.{0,220}(?:swap|calendar|year|month|ajax|json|fetch).{0,700}',x.text,re.I|re.S):
                      print("MATCH",m.group(0).replace("\n"," ")[:1400])
          print("HTML_RELEVANT")
          for m in re.finditer(r'.{0,220}(?:swap|calendar|year|month|select).{0,700}',r.text,re.I|re.S):
              z=m.group(0).replace("\n"," ")
              if any(k in z.lower() for k in ("swap","calendar","month")):
                  print("HTML",z[:1400])
          PY
