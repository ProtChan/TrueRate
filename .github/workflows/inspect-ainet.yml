name: Inspect Ainet FX swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ainet.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - name: Inspect official Ainet JSON and PDFs
        run: |
          python - <<'PY'
          import io, json, requests
          from pypdf import PdfReader
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          base="https://inet-sec.co.jp"
          for path in (
              "/study/fx-guide/js/pubSwapList.json",
              "/study/fx-guide/js/pubSwapList_sys.json",
          ):
              r=requests.get(base+path,headers=h,timeout=30)
              print("JSON",path,r.status_code,len(r.content),r.headers.get("content-type"))
              r.raise_for_status()
              for enc in ("utf-8-sig","cp932","shift_jis"):
                  try:
                      txt=r.content.decode(enc)
                      data=json.loads(txt)
                      print("ENC",enc,"TYPE",type(data).__name__,"COUNT",len(data))
                      print("FIRST",data[:3] if isinstance(data,list) else list(data.items())[:3])
                      print("LAST",data[-3:] if isinstance(data,list) else "")
                      break
                  except Exception:
                      pass

          for name,path in (
              ("prev","/study/fx-guide/swap-point/swap_zengetu.pdf"),
              ("curr","/study/fx-guide/swap-point/swap_tougetu.pdf"),
          ):
              r=requests.get(base+path,headers=h,timeout=30)
              print("PDF",name,r.status_code,len(r.content),r.headers.get("content-type"))
              r.raise_for_status()
              reader=PdfReader(io.BytesIO(r.content))
              print("PAGES",len(reader.pages))
              for i,page in enumerate(reader.pages[:8]):
                  txt=page.extract_text() or ""
                  print("PDFPAGE",name,i,txt[:5000].replace("\n"," | "))
          PY
