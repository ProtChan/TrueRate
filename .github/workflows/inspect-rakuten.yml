name: Inspect Rakuten FX swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-rakuten.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect Rakuten mapping
        run: |
          python - <<'PY'
          import re,requests
          from bs4 import BeautifulSoup
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          u="https://www.rakuten-sec.co.jp/web/fx/spread_swap/"
          r=requests.get(u,headers=h,timeout=30)
          r.raise_for_status()
          r.encoding=r.apparent_encoding or r.encoding
          soup=BeautifulSoup(r.text,"html.parser")
          mapping={}
          for tr in soup.find_all("tr"):
              label=(tr.find(["th","td"]).get_text(" ",strip=True) if tr.find(["th","td"]) else "")
              target=tr.find(id=re.compile(r"^FXSWA\d+$"))
              if not target:
                  continue
              idx=int(re.search(r"(\d+)$",target.get("id")).group(1))
              mapping[idx]=label
          print("MAPPING",mapping)

          d=requests.get("https://www.rakuten-sec.co.jp/web/fx/RateData/SwapData.dat",headers=h,timeout=30)
          d.raise_for_status()
          rows=[]
          for line in d.text.splitlines():
              parts=line.split("\t")
              if len(parts)>=4 and parts[0].isdigit():
                  rows.append((int(parts[0]),parts[1],parts[2],parts[3]))
          print("DATA_ROWS",len(rows))
          print("UNMAPPED_IDS",[x[0] for x in rows if x[0] not in mapping])
          print("MAPPED_DATA",[(idx,mapping.get(idx),sell,buy,dt) for idx,sell,buy,dt in rows])
          PY
