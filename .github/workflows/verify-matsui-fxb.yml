name: Verify Matsui and FX Broadnet

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-matsui-fxb.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify real sources
        env:
          PYTHONPATH: src
        run: |
          python - <<'PY'
          from datetime import date
          from truerate.brokers.matsui_fx import collect_year
          from truerate.brokers.fxbroadnet import collect_month
          today=date(2026,9,26)
          m=collect_year(2026,today_jst=today)
          print("MATSUI",len(m),len({r.pair for r in m}),sorted({r.pair for r in m}))
          for ym in ((2023,10),(2024,1),(2026,9)):
              x=collect_month(*ym,today_jst=today)
              print("FXB",ym,len(x),len({r.pair for r in x}),sorted({r.pair for r in x}))
          PY
