name: Verify SBI timing and margin metadata

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sbi-margin-final.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated data
        run: |
          python - <<'PY'
          import csv, json
          from pathlib import Path

          with open("data/swaps/sbi_fx.csv", encoding="utf-8", newline="") as f:
              rows=[r for r in csv.DictReader(f) if r["pair"]=="USD/JPY"]

          sample=[r for r in rows if "2026-09-01" <= r["trade_date"] <= "2026-09-08"]
          print("SBI_RAW", [(r["trade_date"],r["effective_date"],r["sp_days"],r["long_swap_jpy"],r["short_swap_jpy"]) for r in sample])

          assert all(r["trade_date"]==r["effective_date"] for r in sample if r["trade_date"] not in ("2026-09-05","2026-09-06"))
          for r in sample:
              if r["trade_date"]=="2026-09-05":
                  assert r["effective_date"]=="2026-09-07"
              if r["trade_date"]=="2026-09-06":
                  assert r["effective_date"]=="2026-09-07"

          data=json.loads(Path("site/data/site-data.json").read_text(encoding="utf-8"))
          req=data["metadata"]["margin_requirements"]
          print("MARGIN_METHOD", req.get("method"))
          print("SBI_PAIR_RATES", req.get("margin_rate_by_broker_pair",{}).get("sbi_fx"))
          print("MINFX_PAIR_RATES", req.get("margin_rate_by_broker_pair",{}).get("minfx"))
          print("CLICK365", req.get("click365",{}).get("effective_start"), req.get("click365",{}).get("effective_end"))
          print("CLICK365_USDJPY", req.get("click365",{}).get("per_pair_jpy",{}).get("USD/JPY"))
          print("CLICK365_HUFJPY", req.get("click365",{}).get("per_pair_jpy",{}).get("HUF/JPY"))

          assert req["margin_rate_by_broker_pair"]["sbi_fx"]["BRL/JPY"] == 0.10
          assert req["margin_rate_by_broker_pair"]["sbi_fx"]["RUB/JPY"] == 0.33
          assert req["margin_rate_by_broker_pair"]["minfx"]["RUB/JPY"] == 0.10
          assert req["margin_rate_by_broker_pair"]["lightfx"]["RUB/JPY"] == 0.10
          assert req["click365"]["per_pair_jpy"]["USD/JPY"] > 0
          assert req["click365"]["per_pair_jpy"]["HUF/JPY"] > 0
          PY
