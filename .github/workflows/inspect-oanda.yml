name: Inspect OANDA swap CSVs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-oanda.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official CSVs
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          pages={
            "tokyo":"https://www.oanda.jp/fx/ty3/swap",
            "ny":"https://www.oanda.jp/fx/ny4/swap",
          }
          for name,u in pages.items():
              r=requests.get(u,headers=h,timeout=30)
              print("\nPAGE",name,r.status_code,r.url,len(r.text))
              soup=BeautifulSoup(r.text,"html.parser")
              for a in soup.find_all("a",href=True):
                  href=urljoin(r.url,a["href"])
                  txt=a.get_text(" ",strip=True)
                  if "csv" in href.lower() or "csv" in txt.lower() or "swap" in href.lower():
                      print("LINK",name,txt[:100],href)
                      if "csv" in href.lower():
                          c=requests.get(href,headers=h,timeout=60)
                          print("CSV",name,c.status_code,len(c.content),c.headers.get("content-type"))
                          for enc in ("utf-8-sig","cp932","shift_jis","utf-8"):
                              try:
                                  t=c.content.decode(enc)
                                  print("ENC",enc)
                                  print("HEAD")
                                  print("\n".join(t.splitlines()[:80]))
                                  print("TAIL")
                                  print("\n".join(t.splitlines()[-30:]))
                                  break
                              except Exception:
                                  pass
          PY
