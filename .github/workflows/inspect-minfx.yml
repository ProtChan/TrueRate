name: Inspect MinFX swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-minfx.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official calendar internals
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          u="https://min-fx.jp/market/swap/"
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          r=requests.get(u,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          scripts=[]
          for s in soup.find_all("script",src=True):
              su=urljoin(r.url,s["src"])
              scripts.append(su)
              print("SCRIPT",su)
          print("\nINLINE")
          for pat in [
              r'.{0,240}(?:swap|calendar|year|month|api|json|csv|axios|fetch).{0,600}',
              r'https?://[^"\'<> ]+',
              r'/[^"\'<> ]*(?:swap|calendar|api|json|csv)[^"\'<> ]*',
          ]:
              for m in re.finditer(pat,r.text,re.I|re.S):
                  z=m.group(0).replace("\n"," ")
                  if any(k in z.lower() for k in ("swap","calendar","api","json","csv","fetch")):
                      print(z[:1100])
          print("\nTABLE STRUCTURE")
          for div_id in ("symbol1","symbol2","symbol3","symbol4","symbol6"):
              div=soup.find(id=div_id)
              if not div:
                  print("MISSING",div_id)
                  continue
              table=div.find("table")
              headers=[x.get_text(" ",strip=True) for x in table.select("thead th")]
              print("HEADERS",div_id,headers)
              for tr in table.select("tbody tr")[:9]:
                  print("ROW",div_id,[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])])
          print("\nFORMS")
          for form in soup.find_all("form"):
              print("FORM",form.get("action"),form.get("method"))
              for tag in form.find_all(["select","input","option","button"]):
                  print(tag.name,tag.get("name"),tag.get("value"),tag.get("selected"),tag.get_text(" ",strip=True)[:100])
          print("\nSELECTS")
          for sel in soup.find_all("select"):
              print("SELECT",sel.get("id"),sel.get("name"),[(o.get("value"),o.get_text(" ",strip=True),bool(o.get("selected"))) for o in sel.find_all("option")][:80])
          print("\nQUERY PROBES")
          probes=[
              {"year":"2026","month":"8"},
              {"year":"2025","month":"12"},
              {"ym":"202608"},
              {"date":"202608"},
              {"month":"202608"},
              {"yyyymm":"202608"},
          ]
          for params in probes:
              try:
                  q=requests.get(u,params=params,headers=h,timeout=30)
                  qs=BeautifulSoup(q.text,"html.parser")
                  dates=[]
                  for tr in qs.select("table.table-swap tbody tr"):
                      cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                      if cells: dates.append(cells[0])
                  print("PROBE",params,q.url,len(q.text),dates[:5])
              except Exception as e:
                  print("PROBE_ERR",params,e)
          print("\nASSETS")
          for su in scripts:
              try:
                  x=requests.get(su,headers=h,timeout=30)
                  print("\nASSET",x.status_code,su,len(x.text))
                  for m in re.finditer(r'.{0,240}(?:swap|calendar|year|month|api|json|csv|axios|fetch).{0,700}',x.text,re.I|re.S):
                      print(m.group(0).replace("\n"," ")[:1300])
              except Exception as e:
                  print("ERR",su,e)
          PY
