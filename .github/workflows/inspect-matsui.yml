name: Inspect Matsui swap history source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-matsui.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          u="https://www.matsui.co.jp/fx/market/past-swap/"
          r=requests.get(u,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          print("SCRIPTS")
          for s in soup.find_all("script",src=True):
              su=urljoin(r.url,s["src"])
              print("SCRIPT",su)
              if "google" in su or "marsflag" in su:
                  continue
              try:
                  x=requests.get(su,headers=h,timeout=30)
                  txt=x.text
                  if any(k in txt.lower() for k in ("swap","past-swap","api","json")):
                      print("LEN",len(txt))
                      for pat in [
                          r'https?://[^"\'<> ]+',
                          r'["\']([^"\']*(?:swap|api|json)[^"\']*)["\']',
                          r'.{0,160}(?:past-swap|swap|api|json|fetch|ajax).{0,420}',
                      ]:
                          for m in re.finditer(pat,txt,re.I|re.S):
                              z=m.group(0).replace("\n"," ")
                              if any(k in z.lower() for k in ("swap","api","json")):
                                  print("MATCH",z[:1000])
              except Exception as e:
                  print("ERR",e)
          print("CSV_PROBES")
          for y in (2023,2024,2026):
              cu=f"https://www.matsui.co.jp/fx/market/past-swap/csv/swap_{y}.csv"
              cr=requests.get(cu,headers=h,timeout=30)
              print("CSV",y,cr.status_code,len(cr.content),cr.headers.get("content-type"))
              for enc in ("utf-8-sig","cp932","shift_jis"):
                  try:
                      txt=cr.content.decode(enc)
                      print("ENC",enc)
                      print(txt[:9000])
                      break
                  except Exception:
                      pass
          import csv, io
          print("PAIR_NAMES")
          for y in (2023,2026):
              cu=f"https://www.matsui.co.jp/fx/market/past-swap/csv/swap_{y}.csv"
              cr=requests.get(cu,headers=h,timeout=30)
              txt=cr.content.decode("cp932")
              names=sorted({row["通貨ペア"] for row in csv.DictReader(io.StringIO(txt)) if row.get("通貨ペア")})
              print("MATSUI_PAIRS",y,len(names),names)
          print("FXB_OLDEST_PROBES")
          for ym in ("202309","202308","202301","202210"):
              pu=f"https://www.fxbroadnet.com/pdf/swap_calendar{ym}.pdf"
              pr=requests.get(pu,headers=h,timeout=30)
              print("FXB_PDF",ym,pr.status_code,len(pr.content),pr.headers.get("content-type"))
          print("HTML_MATCHES")
          for pat in [
              r'https?://[^"\'<> ]+',
              r'["\']([^"\']*(?:swap|api|json)[^"\']*)["\']',
              r'.{0,180}(?:past-swap|swap|api|json|fetch|ajax).{0,500}',
          ]:
              for m in re.finditer(pat,r.text,re.I|re.S):
                  z=m.group(0).replace("\n"," ")
                  if any(k in z.lower() for k in ("swap","api","json")):
                      print("HTML",z[:1000])
          PY
