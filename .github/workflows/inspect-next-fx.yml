name: Inspect next FX broker sources

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-next-fx.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - name: Inspect official sources
        run: |
          python - <<'PY'
          import re, io, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pypdf import PdfReader

          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          pages={
            "matsui":"https://www.matsui.co.jp/fx/market/swappoint/",
            "dmm":"https://fx.dmm.com/fx/service/swapcalendar/",
            "fxb":"https://www.fxbroadnet.com/swap.jsp",
          }
          for name,u in pages.items():
              print("\n====",name,u,"====")
              r=requests.get(u,headers=h,timeout=30)
              print("PAGE",r.status_code,r.url,len(r.text),r.headers.get("content-type"))
              soup=BeautifulSoup(r.text,"html.parser")
              print("TITLE",soup.title.get_text(" ",strip=True) if soup.title else "")
              print("FORMS")
              for form in soup.find_all("form"):
                  print("FORM",form.get("action"),form.get("method"),form.get("id"),form.get("name"))
                  for tag in form.find_all(["select","input","button"])[:80]:
                      print(" ",tag.name,tag.get("name"),tag.get("value"),tag.get("type"),tag.get("id"))
              print("SCRIPTS")
              for s in soup.find_all("script",src=True):
                  su=urljoin(r.url,s["src"])
                  print("SCRIPT",su)
                  try:
                      x=requests.get(su,headers=h,timeout=30)
                      for m in re.finditer(r'.{0,220}(?:swap|api|ajax|json|year|month|calendar|fetch).{0,600}',x.text,re.I|re.S):
                          z=m.group(0).replace("\n"," ")
                          print(" MATCH",z[:1000])
                  except Exception as e:
                      print("ERR",e)
              print("INLINE")
              for m in re.finditer(r'.{0,220}(?:swap|api|ajax|json|year|month|calendar|fetch).{0,700}',r.text,re.I|re.S):
                  z=m.group(0).replace("\n"," ")
                  print(z[:1200])

          print("\n==== FXB PDF probe ====")
          for ym in ("202608","202401","202310"):
              u=f"https://www.fxbroadnet.com/pdf/swap_calendar{ym}.pdf"
              r=requests.get(u,headers=h,timeout=30)
              print("PDF",ym,r.status_code,len(r.content),r.headers.get("content-type"))
              if r.ok and "pdf" in r.headers.get("content-type","").lower():
                  reader=PdfReader(io.BytesIO(r.content))
                  print("PAGES",len(reader.pages))
                  for i,p in enumerate(reader.pages[:3]):
                      txt=p.extract_text() or ""
                      print("PAGE",i,txt[:2600].replace("\n"," | "))
          PY
