name: Inspect Ainet FX swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-ainet.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Compare regular and Loop-if-done JSON
        run: |
          python - <<'PY'
          import requests
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          base="https://inet-sec.co.jp/study/fx-guide/js/"
          def fetch(name):
              r=requests.get(base+name,headers=h,timeout=30)
              r.raise_for_status()
              return {x["TSUUKA"]:x for x in r.json()["query"]}
          a=fetch("pubSwapList.json")
          b=fetch("pubSwapList_sys.json")
          print("REGULAR_COUNT",len(a),sorted(a))
          print("LOOP_COUNT",len(b),sorted(b))
          common=sorted(set(a)&set(b))
          diffs=[]
          for pair in common:
              aa=a[pair]; bb=b[pair]
              fields=("URI","KAI","SWAP_NISSUU","TEKIYOU_KAISHIBI","EIGYOUBI")
              if any(aa.get(k)!=bb.get(k) for k in fields):
                  diffs.append((pair,{k:aa.get(k) for k in fields},{k:bb.get(k) for k in fields}))
          print("DIFF_COUNT",len(diffs))
          print("DIFFS",diffs)
          print("REG_ONLY",sorted(set(a)-set(b)))
          print("LOOP_ONLY",sorted(set(b)-set(a)))
          PY
