name: Inspect MinFX swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-minfx.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Inspect official calendar internals
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          u="https://min-fx.jp/market/swap/"
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}
          r=requests.get(u,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          scripts=[]
          for s in soup.find_all("script",src=True):
              su=urljoin(r.url,s["src"])
              scripts.append(su)
              print("SCRIPT",su)
          print("\nINLINE")
          for pat in [
              r'.{0,240}(?:swap|calendar|year|month|api|json|csv|axios|fetch).{0,600}',
              r'https?://[^"\'<> ]+',
              r'/[^"\'<> ]*(?:swap|calendar|api|json|csv)[^"\'<> ]*',
          ]:
              for m in re.finditer(pat,r.text,re.I|re.S):
                  z=m.group(0).replace("\n"," ")
                  if any(k in z.lower() for k in ("swap","calendar","api","json","csv","fetch")):
                      print(z[:1100])
          print("\nASSETS")
          for su in scripts:
              try:
                  x=requests.get(su,headers=h,timeout=30)
                  print("\nASSET",x.status_code,su,len(x.text))
                  for m in re.finditer(r'.{0,240}(?:swap|calendar|year|month|api|json|csv|axios|fetch).{0,700}',x.text,re.I|re.S):
                      print(m.group(0).replace("\n"," ")[:1300])
              except Exception as e:
                  print("ERR",su,e)
          PY
