name: Inspect DMM swap source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-dmm-central.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Inspect DMM API history
        run: |
          python - <<'PY'
          import requests, json
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en-US;q=0.9,en;q=0.8"}
          base="https://fx.dmm.com/api/fx/swap/swapcalendar_{}.json"
          for code in ("USD_JPY","EUR_USD","USM_JPY","USL_JPY"):
              u=base.format(code)
              r=requests.get(u,headers=h,timeout=30)
              print("API",code,r.status_code,len(r.content),r.headers.get("content-type"))
              r.raise_for_status()
              data=r.json()
              print("KEYS",data.keys())
              swap=data.get("body",{}).get("swap",[])
              print("COUNT",len(swap))
              if swap:
                  print("FIRST",swap[0])
                  print("LAST",swap[-1])
                  print("SAMPLE",swap[:3])
          PY
