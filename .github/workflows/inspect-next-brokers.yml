name: Inspect Gaitame Online and Central Tanshi

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-next-brokers.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pypdf
      - name: Inspect official sources
        run: |
          python - <<'PY'
          import io,re,requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from pypdf import PdfReader
          h={"User-Agent":"Mozilla/5.0","Accept-Language":"ja,en;q=0.8"}

          print("=== GAITAME ONLINE PDF ===")
          for ym in ("202609","202401","202301","202201"):
              u=f"https://www.gaitameonline.com/pdf/swap{ym}.pdf"
              r=requests.get(u,headers=h,timeout=30)
              print("PDF",ym,r.status_code,len(r.content),r.headers.get("content-type"))
              if r.ok and r.content.startswith(b"%PDF"):
                  reader=PdfReader(io.BytesIO(r.content))
                  print("PAGES",len(reader.pages))
                  for i,p in enumerate(reader.pages[:4]):
                      t=p.extract_text() or ""
                      print("PAGE",i,t[:5000].replace("\n"," | "))

          print("\n=== CENTRAL TANSI ===")
          u="https://www.central-tanshifx.com/market/swapcalendar/"
          r=requests.get(u,headers=h,timeout=30)
          print("PAGE",r.status_code,r.url,len(r.text))
          soup=BeautifulSoup(r.text,"html.parser")
          for form in soup.find_all("form"):
              print("FORM",form.get("action"),form.get("method"),form.get("id"))
              for tag in form.find_all(["select","input","button"])[:100]:
                  print(" ",tag.name,tag.get("name"),tag.get("value"),tag.get("type"),tag.get("id"))
          for s in soup.find_all("script",src=True):
              su=urljoin(r.url,s["src"])
              print("SCRIPT",su)
              try:
                  x=requests.get(su,headers=h,timeout=30)
                  if any(k in x.text.lower() for k in ("swap","calendar","json","api","ajax","fetch")):
                      for m in re.finditer(r'.{0,220}(?:swap|calendar|json|api|ajax|fetch).{0,700}',x.text,re.I|re.S):
                          print("MATCH",m.group(0).replace("\n"," ")[:1200])
              except Exception as e: print("ERR",e)
          print("TABLES")
          for i,table in enumerate(soup.find_all("table")[:10]):
              rows=[]
              for tr in table.find_all("tr")[:12]:
                  cells=[x.get_text(" ",strip=True) for x in tr.find_all(["th","td"])]
                  if cells: rows.append(cells)
              print("TABLE",i)
              for row in rows: print(" ROW",row)
          PY
